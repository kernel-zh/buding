name: Sync lore and Git data

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Optional backfill start date, for example 2025-01-01"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: zhujian-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Select the daily Git cache
        id: git-cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore cached Linux repositories
        uses: actions/cache@v6
        with:
          path: .cache/git
          key: linux-git-v1-${{ runner.os }}-${{ steps.git-cache-date.outputs.date }}
          restore-keys: |
            linux-git-v1-${{ runner.os }}-

      - name: Install lei
        run: |
          sudo apt-get update
          sudo apt-get install --yes public-inbox lei
          lei q --help >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the last synchronization snapshot from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: pnpm hydrate:supabase

      - name: Synchronize and generate tracking data
        env:
          SYNC_SINCE: ${{ inputs.since }}
        run: pnpm sync

      - name: Validate generated data
        run: pnpm validate:data

      - name: Run tests
        run: pnpm test

      - name: Publish generated data to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: pnpm publish:supabase

      - name: Publish synchronization failure state
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          pnpm publish:supabase
